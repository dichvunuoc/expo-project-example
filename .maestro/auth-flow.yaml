# Auth Flow Test
# Tests the sign-in-by-email feature
# FSD Layer: Features/Auth/SignInByEmail
appId: ${APP_ID}
---
- launchApp
- assertVisible: 'Welcome Back'
- tapOn: 'Enter your email'
- inputText: ${TEST_EMAIL}
- tapOn: 'Enter your password'
- inputText: ${TEST_PASSWORD}
- tapOn: 'Sign In'
# Wait for successful navigation to Home Tab
- assertVisible: 'Home Tab'
